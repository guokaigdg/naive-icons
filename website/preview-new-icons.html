<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9 枚新图标 · 预览 · Naive Icons</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { padding-bottom: 80px; }
  .preview-hero { padding: var(--s7) var(--s5) var(--s4); }
  .preview-hero h1 {
    font-family: var(--font-hand);
    font-size: clamp(28px, 5vw, 46px);
    margin: 0 0 var(--s2);
    letter-spacing: 0.01em;
  }
  .preview-hero p { color: var(--text-2); margin: 0 0 6px; max-width: 62ch; line-height: 1.7; }
  .preview-hero .base { color: var(--text-3); font-size: 13px; }
  .preview-bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center;
    padding: var(--s3) var(--s5);
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .preview-bar input[type="search"] {
    flex: 1 1 200px; min-width: 180px;
    padding: 9px 14px; border-radius: var(--r-full);
    border: 1px solid var(--line-2); background: var(--card); color: var(--text);
    font: inherit; font-size: 14px;
  }
  .sizes { display: inline-flex; gap: 4px; background: var(--card-2); padding: 4px; border-radius: var(--r-full); }
  .sizes button {
    border: 0; background: transparent; color: var(--text-2); cursor: pointer;
    font: inherit; font-size: 13px; padding: 5px 12px; border-radius: var(--r-full);
  }
  .sizes button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: var(--s4) var(--s5) 0; }
  .grid { border: 1px solid var(--line); border-radius: var(--r-hand); background: var(--card); margin: var(--s4) var(--s5) 0; }
  .cell__comp { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--code-bg); color: var(--code-text);
    padding: 11px 18px; border-radius: var(--r-full); font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .22s var(--ease); z-index: 90;
    max-width: 90vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .count { color: var(--text-3); font-size: 13px; margin-left: auto; }
  .cat-title {
    font-family: var(--font-hand); font-size: 20px; margin: var(--s6) var(--s5) var(--s1);
    display: flex; align-items: baseline; gap: var(--s2);
  }
  .cat-title small { font-family: var(--font-sans); font-size: 12px; color: var(--text-3); }
</style>
</head>
<body>
<header class="preview-hero">
  <h1>9 枚新图标 · 预览</h1>
  <p>naive-icons 从 <b>723</b> 枚扩到 <b>731</b> 枚，页面里是这一轮新增的 <b>9</b> 枚：食物、动物、自然天气、工具、运动、日常物品…… 覆盖日常界面里真会用到的那些。点任意一枚可复制 React 引入代码。</p>
  <p class="base">基准是上一个发布版本 <b>v1.15.0</b>；已发布的图标不再重复展示，后来删除的也不会残留。</p>
</header>

<div class="preview-bar">
  <input type="search" id="q" placeholder="搜索 id 或中文名，例如 qr、扫码、奶牛">
  <div class="sizes" role="group" aria-label="预览尺寸">
    <button type="button" data-size="16">16</button>
    <button type="button" data-size="24" aria-pressed="true">24</button>
    <button type="button" data-size="48">48</button>
    <button type="button" data-size="72">72</button>
  </div>
  <span class="count" id="count"></span>
</div>

<div class="chips" id="chips" role="group" aria-label="分类筛选"></div>
<main id="root"></main>
<section class="sec" id="changed" hidden>
  <h2 class="cat-title">本次改动 <small>既有图标的重绘 / 去五官</small></h2>
  <div class="grid" id="changedGrid" style="--icon-size:48px"></div>
</section>
<div class="toast" id="toast"></div>

<script>

" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#2A2A2A\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M 36 10 C 30 8 22 12 17 20 C 13 26 11 33 10 38 C 15 37 22 34 27 27 C 32 20 36 14 36 10 Z\" fill=\"#FAEDCD\"/>\n<path d=\"M 10.5 37.5 C 17 32 26 24 34.5 12\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" fill=\"none\"/>\n<path d=\"M 10.5 37.5 C 9 39.5 8 41 7 42.5\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" fill=\"none\"/>\n<path d=\"M 16 31.5 L 20.5 35\" stroke=\"#2A2A2A\" stroke-width=\"1.8\" fill=\"none\"/>\n<path d=\"M 21.5 25 L 26 28.5\" stroke=\"#2A2A2A\" stroke-width=\"1.8\" fill=\"none\"/>\n<path d=\"M 27 18.5 L 31 21.5\" stroke=\"#2A2A2A\" stroke-width=\"1.8\" fill=\"none\"/>\n<path d=\"M 17 29.5 L 13.5 27\" stroke=\"#2A2A2A\" stroke-width=\"1.8\" fill=\"none\"/>\n<path d=\"M 22.5 23 L 19.5 20\" stroke=\"#2A2A2A\" stroke-width=\"1.8\" fill=\"none\"/>\n</svg>"},{"id":"peach","zh":"桃子","cat":"food","comp":"PeachIcon","svg":"<svg viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#2A2A2A\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M 24 15 C 21 11 16 10 12 13 C 7 16 7 23 9 29 C 12 36 18 40 24 40 C 30 40 36 36 39 29 C 41 23 41 16 36 13 C 32 10 27 11 24 15 Z\" fill=\"#F4A6A4\"/>\n<path d=\"M 24 16 C 23.5 20 23.5 24 24 27\" stroke=\"#2A2A2A\" stroke-width=\"2\" fill=\"none\"/>\n<path d=\"M 24.5 14 C 26 9 31 5 37 5.5 C 38 11 33 15 24.5 14 Z\" fill=\"#588157\"/>\n<path d=\"M 24 14 C 24 11 23 9 23 8\" stroke=\"#8B5E3C\" stroke-width=\"2.5\" fill=\"none\"/>\n</svg>"},{"id":"pumpkin","zh":"南瓜","cat":"food","comp":"PumpkinIcon","svg":"<svg viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#2A2A2A\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M 7.5 28 C 7.5 23 10 19 14 18 C 16 17.5 17.5 18.5 19 20 C 20.5 17.5 22 16.5 24 16.5 C 26 16.5 27.5 17.5 29 20 C 30.5 18.5 32 17.5 34 18 C 38 19 40.5 23 40.5 28 C 40.5 33 38 37 34 38 C 32 38.5 30.5 37.5 29 36 C 27.5 38 26 39 24 39 C 22 39 20.5 38 19 36 C 17.5 37.5 16 38.5 14 38 C 10 37 7.5 33 7.5 28 Z\" fill=\"#E76F51\"/>\n<path d=\"M 19 20.5 C 17.5 25 17.5 31 19 35.5\" stroke=\"#2A2A2A\" stroke-width=\"2\" fill=\"none\"/>\n<path d=\"M 29 20.5 C 30.5 25 30.5 31 29 35.5\" stroke=\"#2A2A2A\" stroke-width=\"2\" fill=\"none\"/>\n<path d=\"M 22.5 16.5 C 22 12.5 22.5 9.5 24 8 C 25.5 9.5 26 12.5 25.5 16.5 Z\" fill=\"#8B5E3C\" stroke-width=\"2\"/>\n<path d=\"M 25.5 10.5 C 29 9.5 31.5 7.5 32.5 5.5\" stroke=\"#588157\" stroke-width=\"2\" fill=\"none\"/>\n</svg>"},{"id":"turtle","zh":"海龟","cat":"animals","comp":"TurtleIcon","svg":"<svg viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#2A2A2A\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M 14.5 21.5 C 11 21 8 19 6.5 16 C 9.5 15.5 12.5 17 15 19.5 Z\" fill=\"#588157\" stroke-width=\"2\"/>\n<path d=\"M 33.5 21.5 C 37 21 40 19 41.5 16 C 38.5 15.5 35.5 17 33 19.5 Z\" fill=\"#588157\" stroke-width=\"2\"/>\n<path d=\"M 14.5 32.5 C 11 33 8 35 6.5 38 C 9.5 38.5 12.5 37 15 34.5 Z\" fill=\"#588157\" stroke-width=\"2\"/>\n<path d=\"M 33.5 32.5 C 37 33 40 35 41.5 38 C 38.5 38.5 35.5 37 33 34.5 Z\" fill=\"#588157\" stroke-width=\"2\"/>\n<ellipse cx=\"24\" cy=\"12.5\" rx=\"4.4\" ry=\"4.6\" fill=\"#588157\"/>\n<path d=\"M 11 27 C 11 20.5 16.5 16.5 24 16.5 C 31.5 16.5 37 20.5 37 27 C 37 33.5 31.5 37.5 24 37.5 C 16.5 37.5 11 33.5 11 27 Z\" fill=\"#588157\"/>\n<path d=\"M 24 20.5 L 29.5 24 L 29.5 30.5 L 24 34 L 18.5 30.5 L 18.5 24 Z\" stroke=\"#2A2A2A\" stroke-width=\"2\" fill=\"none\"/>\n<path d=\"M 22 37 C 22.5 39.5 23.2 41 24 41 C 24.8 41 25.5 39.5 26 37 Z\" fill=\"#588157\" stroke-width=\"2\"/>\n<circle cx=\"22.4\" cy=\"11.5\" r=\"1\" fill=\"#2A2A2A\" stroke=\"none\"/>\n<circle cx=\"25.6\" cy=\"11.5\" r=\"1\" fill=\"#2A2A2A\" stroke=\"none\"/>\n</svg>"},{"id":"whale","zh":"鲸鱼","cat":"animals","comp":"WhaleIcon","svg":"<svg viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#2A2A2A\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M 7.5 26 C 7.5 19.5 13 15.5 20 15.5 C 26 15.5 31.5 17.5 34.5 20.5 C 36.5 16.8 38.8 14.2 41.5 13 C 41.8 17.5 41 21.5 38.5 24.5 C 40.8 27.5 41.5 31.5 41.2 35.5 C 38.2 34 36 31.5 34.4 28.5 C 31.5 32.8 26 34.8 19.5 34.8 C 12 34.8 7.5 32 7.5 26 Z\" fill=\"#264653\"/>\n<path d=\"M 17.5 14.5 C 15.8 10.5 16.5 7 19 5.5\" stroke=\"#FAEDCD\" stroke-width=\"2.5\" fill=\"none\"/>\n<path d=\"M 8.2 28.5 C 11.5 30.5 15 31 18.5 30.5\" stroke=\"#FAEDCD\" stroke-width=\"2\" fill=\"none\"/>\n<circle cx=\"15\" cy=\"22\" r=\"1.4\" fill=\"#FAEDCD\" stroke=\"none\"/>\n</svg>"}];
var ICONS = ALL.filter(function (i) { return i.cat !== 'changed'; });
var CHANGED = ALL.filter(function (i) { return i.cat === 'changed'; });
var CATS = {"animals": "动物", "food": "食物饮品", "objects": "日常物品", "places": "建筑场所"};
var state = { q: '', cat: 'all', size: 24 };
var root = document.getElementById('root');
var toast = document.getElementById('toast');

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function matches(i) {
  if (state.cat !== 'all' && i.cat !== state.cat) return false;
  if (!state.q) return true;
  var q = state.q.toLowerCase();
  return i.id.indexOf(q) >= 0 || i.zh.indexOf(state.q) >= 0 ||
         i.comp.toLowerCase().indexOf(q) >= 0;
}

function render() {
  var list = ICONS.filter(matches);
  var byCat = {};
  list.forEach(function (i) { (byCat[i.cat] = byCat[i.cat] || []).push(i); });
  var html = '';
  Object.keys(CATS).forEach(function (cat) {
    var items = byCat[cat];
    if (!items || !items.length) return;
    html += '<h2 class="cat-title">' + esc(CATS[cat]) + '<small>' + items.length + ' 枚</small></h2>';
    html += '<div class="grid" style="--icon-size:' + state.size + 'px">';
    items.forEach(function (i) {
      html += '<button class="cell" type="button" data-id="' + esc(i.id) + '" title="' + esc(i.zh) + '">' +
              '<span class="cell__icon">' + i.svg + '</span>' +
              '<span class="cell__name">' + esc(i.id) + '</span>' +
              '<span class="cell__zh">' + esc(i.zh) + '</span>' +
              '<span class="cell__comp">' + esc(i.comp) + '</span>' +
              '</button>';
    });
    html += '</div>';
  });
  root.innerHTML = html || '<p style="padding:40px;color:var(--text-3)">没找到匹配的图标。</p>';
  document.getElementById('count').textContent = list.length + ' / ' + ICONS.length + ' 枚';

  Array.prototype.forEach.call(root.querySelectorAll('.cell'), function (cell) {
    cell.addEventListener('click', function () {
      var id = cell.getAttribute('data-id');
      var item = ICONS.filter(function (i) { return i.id === id; })[0];
      var code = "import { " + item.comp + " } from 'naive-icons';";
      copy(code);
      show('已复制  ' + code);
    });
  });
}

function copy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(fallback);
  } else { fallback(); }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
}

var timer;
function show(msg) {
  toast.textContent = msg;
  toast.classList.add('on');
  clearTimeout(timer);
  timer = setTimeout(function () { toast.classList.remove('on'); }, 2200);
}

/* 本次改动 */
function renderChanged() {
  if (!CHANGED.length) return;
  document.getElementById('changed').hidden = false;
  document.getElementById('changedGrid').innerHTML = CHANGED.map(function (i) {
    return '<button class="cell" type="button" data-id="' + esc(i.id) + '">' +
           '<span class="cell__icon">' + i.svg + '</span>' +
           '<span class="cell__name">' + esc(i.id) + '</span>' +
           '<span class="cell__zh">' + esc(i.zh) + '</span>' +
           '<span class="cell__comp">' + esc(i.comp) + '</span>' +
           '</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#changedGrid .cell'), function (cell) {
    cell.addEventListener('click', function () {
      var id = cell.getAttribute('data-id');
      var item = CHANGED.filter(function (i) { return i.id === id; })[0];
      var code = "import { " + item.comp + " } from 'naive-icons';";
      copy(code);
      show('已复制  ' + code);
    });
  });
}

/* 分类 chips */
var chips = document.getElementById('chips');
chips.innerHTML = '<button class="chip" type="button" data-cat="all" aria-pressed="true">全部 ' + ICONS.length + '</button>' +
  Object.keys(CATS).map(function (c) {
    var n = ICONS.filter(function (i) { return i.cat === c; }).length;
    return n ? '<button class="chip" type="button" data-cat="' + c + '">' + esc(CATS[c]) + ' ' + n + '</button>' : '';
  }).join('');
chips.addEventListener('click', function (e) {
  var b = e.target.closest('.chip');
  if (!b) return;
  state.cat = b.getAttribute('data-cat');
  Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (c) {
    c.setAttribute('aria-pressed', String(c === b));
  });
  render();
});

/* 尺寸 */
document.querySelector('.sizes').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  state.size = parseInt(b.getAttribute('data-size'), 10);
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (c) {
    c.setAttribute('aria-pressed', String(c === b));
  });
  render();
});

/* 搜索 */
document.getElementById('q').addEventListener('input', function (e) {
  state.q = e.target.value.trim();
  render();
});

/* 深浅色 */
var saved = localStorage.getItem('naive-preview-theme');
if (saved) document.documentElement.setAttribute('data-theme', saved);
function toggleTheme() {
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('naive-preview-theme', next);
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'd' || e.key === 'D') toggleTheme();
});

renderChanged();
render();
</script>
</body>
</html>
